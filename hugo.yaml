---
baseURL: 'https://riga.dev/'
languageCode: 'en-us'
title: 'riga.dev'
theme: 'PaperMod'
enableEmoji: true

params:
  env: production
  title: 'Riga Dev'
  description: 'Riga Dev community blog'
  keywords: [Events, Chat, Groups, Interests, IT]
  author: 'Dzintars'
  dateFormat: '2006 Jan 02'
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  homeInfoParams:
    Title: Hi there wave
    Content: Can be Info, links, about...
  profileMode:
    enabled: true
    title: Hi there!
    subtitle: |
      Probably a nice campfire for Europe/Riga Dev community. \
      Join our <strong><a href="https://discord.gg/rpaH4D4Tfd" target="_blank" rel="noopener">Discord Server</a></strong>

  socialIcons:
    - name: github
      url: "https://github.com/dzintars/riga.dev"
    - name: discord
      url: "https://discord.gg/rpaH4D4Tfd"

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10  # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 9
    # - identifier: categories
    #   name: categories
    #   url: /categories/
    #   weight: 10
    # - identifier: tags
    #   name: tags
    #   url: /tags/
    #   weight: 20
    # - identifier: archive
    #   name: archive
    #   url: /archive/
    #   weight: 30
    # - identifier: search
    #   name: search
    #   url: /search/
    #   weight: 40

pygmentsUseClasses: true

markup:
  highlight:
    style: monokai
    # noClasses: false
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON  # necessary for search
...
